<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00A352" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2444" />
      <stop offset="100%" stop-color="#060D1F" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA2" />
      <stop offset="100%" stop-color="#00D06C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- WhatsApp Outer Bubble Ring -->
  <path d="M 230 45 C 125 45 40 130 40 235 C 40 274 52 310 73 340 L 45 440 L 150 412 C 174 425 201 433 230 433 C 335 433 420 348 420 243 C 420 138 335 45 230 45 Z" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Circuit traces top right -->
  <path d="M 330 160 L 390 120 L 440 120" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" />
  <circle cx="440" cy="120" r="9" fill="#00E676" filter="url(#glow)" />
  
  <path d="M 345 200 L 410 180 L 455 180" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" />
  <circle cx="455" cy="180" r="9" fill="#00E676" filter="url(#glow)" />

  <path d="M 335 240 L 380 240 L 420 260 L 445 260" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" />
  <circle cx="445" cy="260" r="9" fill="#00E676" filter="url(#glow)" />

  <!-- Robot Head Base (Dark with smooth corners) -->
  <g transform="translate(230, 235)">
    <!-- Antenna -->
    <line x1="0" y1="-85" x2="0" y2="-120" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="0" cy="-125" r="14" fill="#00E676" filter="url(#glow)" />

    <!-- Head Body -->
    <rect x="-95" y="-75" width="190" height="150" rx="60" ry="60" fill="url(#bodyGrad)" stroke="#1E293B" stroke-width="6" />

    <!-- Ears / Headphone nubs -->
    <rect x="-112" y="-30" width="18" height="60" rx="9" fill="#00D06C" />
    <rect x="94" y="-30" width="18" height="60" rx="9" fill="#00D06C" />

    <!-- Chat speech notch bottom left -->
    <path d="M -50 70 L -75 105 L -20 74 Z" fill="url(#bodyGrad)" />

    <!-- Glowing Cyan/Green Eyes -->
    <ellipse cx="-42" cy="-5" rx="20" ry="28" fill="#00FFA2" filter="url(#glow)" />
    <ellipse cx="42" cy="-5" rx="20" ry="28" fill="#00FFA2" filter="url(#glow)" />
    <!-- Eye highlights -->
    <ellipse cx="-40" cy="-10" rx="8" ry="12" fill="#FFFFFF" opacity="0.6" />
    <ellipse cx="44" cy="-10" rx="8" ry="12" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Green Plus Badge bottom right -->
  <g transform="translate(340, 340)">
    <circle cx="0" cy="0" r="48" fill="#0A1128" />
    <circle cx="0" cy="0" r="42" fill="url(#neonGlow)" filter="url(#glow)" />
    <!-- Plus symbol -->
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
